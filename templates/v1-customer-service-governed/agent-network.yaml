schemaVersion: 1.0.0
label: Customer Service Broker (governed)
brokers:
  octo_cs1g_customer-service-broker:
    card:
      protocolVersion: 0.3.0
      name: octo_cs1g_customer-service-broker
      description: One front door for orders, returns, billing and loyalty questions, backed by a CRM tool server.
      url: ${ingressgw.url}/octo_cs1g_customer-service-broker
      version: 1.0.0
      capabilities:
        streaming: false
        pushNotifications: false
        stateTransitionHistory: false
      defaultInputModes:
        - application/json
        - text/plain
      defaultOutputModes:
        - application/json
        - text/plain
      skills:
        - id: customer-support
          name: Customer Support
          description: Answer order, return, billing and loyalty questions.
          tags:
            - customer-service
          examples:
            - Where is order SO-9001 for customer C-2001?
            - I want to return the shoes from order SO-9002
            - How many points do I have? I am C-2001
    spec:
      llm:
        ref:
          name: octo_cs1g_openai
        configuration:
          model: gpt-5-mini
      instructions:
        - You are the single front door for customer questions.
        - Identify the customer first with the CRM tool get_customer (customer ids look like C-2001).
        - Route order tracking to the Order Status agent, returns and exchanges to the Returns agent, invoices and payments to the Billing agent, and points or rewards to the Loyalty agent.
        - Open a CRM case when the request cannot be solved in this conversation.
        - Answer in a friendly tone and never invent order or invoice numbers.
      links:
        - agent:
            ref:
              name: octo_cs1g_order-status-agent
        - agent:
            ref:
              name: octo_cs1g_returns-agent
        - agent:
            ref:
              name: octo_cs1g_billing-agent
        - agent:
            ref:
              name: octo_cs1g_loyalty-agent
      tools:
        - mcp:
            ref:
              name: octo_cs1g_crm-mcp
            allowed:
              - get_customer
              - create_case
              - list_cases
      maxNumberOfLoops: 25
      maxConsecutiveErrors: 3
      taskTimeoutSecs: 90
      policies:
        - ref:
            name: rate-limiting
            namespace: 68ef9520-24e9-4cf2-b2f5-620025690913
          configuration:
            rateLimits:
              - maximumRequests: 60
                timePeriodInMilliseconds: 60000
            exposeHeaders: true
llmProviders:
  octo_cs1g_openai:
    label: OpenAI
    description: OpenAI LLM provider
    metadata:
      platform: OpenAI
      models:
        - gpt-5-mini
connections:
  openai-connection:
    kind: llm
    ref:
      name: octo_cs1g_openai
    spec:
      url: https://api.openai.com/v1/
      configuration:
        apiKey: ${openai.apiKey}
        timeout: 600000
  crm-mcp-connection:
    kind: mcp
    ref:
      name: octo_cs1g_crm-mcp
    spec:
      url: ${crmMcp.url}
      policies:
        - ref:
            name: mcp-pii-detector
            namespace: 68ef9520-24e9-4cf2-b2f5-620025690913
          configuration:
            entities:
              - Email
              - US SSN
              - Credit Card
              - Phone Number
            action: Log and mask
  order-status-agent-connection:
    kind: agent
    ref:
      name: octo_cs1g_order-status-agent
    spec:
      url: ${orderStatusAgent.url}
      policies:
        - ref:
            name: a-two-a-pii-detector
            namespace: 68ef9520-24e9-4cf2-b2f5-620025690913
          configuration:
            entities:
              - Email
              - US SSN
              - Credit Card
            action: Log
  returns-agent-connection:
    kind: agent
    ref:
      name: octo_cs1g_returns-agent
    spec:
      url: ${returnsAgent.url}
      policies:
        - ref:
            name: header-injection
            namespace: 68ef9520-24e9-4cf2-b2f5-620025690913
          configuration:
            inboundHeaders:
              - key: x-correlation-source
                value: octo_cs1g_customer-service-broker
        - ref:
            name: a-two-a-prompt-decorator
            namespace: 68ef9520-24e9-4cf2-b2f5-620025690913
          configuration:
            textDecorators:
              - text: "#['Answer concisely and never include personal data.']"
  billing-agent-connection:
    kind: agent
    ref:
      name: octo_cs1g_billing-agent
    spec:
      url: ${billingAgent.url}
      policies:
        - ref:
            name: a-two-a-pii-detector
            namespace: 68ef9520-24e9-4cf2-b2f5-620025690913
          configuration:
            entities:
              - Email
              - US SSN
              - Credit Card
            action: Log
  loyalty-agent-connection:
    kind: agent
    ref:
      name: octo_cs1g_loyalty-agent
    spec:
      url: ${loyaltyAgent.url}
      policies:
        - ref:
            name: header-injection
            namespace: 68ef9520-24e9-4cf2-b2f5-620025690913
          configuration:
            inboundHeaders:
              - key: x-correlation-source
                value: octo_cs1g_customer-service-broker
        - ref:
            name: a-two-a-prompt-decorator
            namespace: 68ef9520-24e9-4cf2-b2f5-620025690913
          configuration:
            textDecorators:
              - text: "#['Answer concisely and never include personal data.']"
mcpServers:
  octo_cs1g_crm-mcp:
    label: CRM MCP
    description: Customer records and support cases.
    metadata:
      transport:
        kind: streamableHttp
        path: /mcp
      tools:
        - name: get_customer
          description: Get a customer profile by customer id.
          inputSchema:
            type: object
            properties:
              customer_id:
                type: string
                description: Customer id, e.g. C-2001
            required:
              - customer_id
        - name: create_case
          description: Open a support case for a customer.
          inputSchema:
            type: object
            properties:
              customer_id:
                type: string
                description: Customer id
              subject:
                type: string
                description: Short subject
            required:
              - customer_id
              - subject
        - name: list_cases
          description: List the open cases of a customer.
          inputSchema:
            type: object
            properties:
              customer_id:
                type: string
                description: Customer id
            required:
              - customer_id
agents:
  octo_cs1g_order-status-agent:
    label: Order Status Agent
    description: Tracks orders and shipments.
    metadata:
      platform: MuleSoft
      protocol: a2a
    card:
      name: Order Status Agent
      description: Tracks orders and shipments.
      url: ${orderStatusAgent.url}
      protocolVersion: 0.3.0
      version: 1.0.0
      capabilities:
        streaming: false
        pushNotifications: false
      defaultInputModes:
        - application/json
        - text/plain
      defaultOutputModes:
        - application/json
        - text/plain
      skills:
        - id: track-order
          name: Track Order
          description: Report the status and delivery estimate of an order.
          tags:
            - orders
          examples:
            - Where is order SO-9001?
  octo_cs1g_returns-agent:
    label: Returns Agent
    description: Handles returns, exchanges and return labels.
    metadata:
      platform: AgentForce
      protocol: a2a
    card:
      name: Returns Agent
      description: Handles returns, exchanges and return labels.
      url: ${returnsAgent.url}
      protocolVersion: 0.3.0
      version: 1.0.0
      capabilities:
        streaming: false
        pushNotifications: false
      defaultInputModes:
        - application/json
        - text/plain
      defaultOutputModes:
        - application/json
        - text/plain
      skills:
        - id: start-return
          name: Start Return
          description: Check return eligibility and create a return label.
          tags:
            - returns
          examples:
            - Return the shoes from order SO-9002
  octo_cs1g_billing-agent:
    label: Billing Agent
    description: Explains invoices, payments and refunds.
    metadata:
      platform: Bedrock
      protocol: a2a
    card:
      name: Billing Agent
      description: Explains invoices, payments and refunds.
      url: ${billingAgent.url}
      protocolVersion: 0.3.0
      version: 1.0.0
      capabilities:
        streaming: false
        pushNotifications: false
      defaultInputModes:
        - application/json
        - text/plain
      defaultOutputModes:
        - application/json
        - text/plain
      skills:
        - id: billing-question
          name: Billing Question
          description: Explain invoices and payment status.
          tags:
            - billing
          examples:
            - Why was I charged twice on invoice INV-7781?
  octo_cs1g_loyalty-agent:
    label: Loyalty Agent
    description: Manages loyalty points, tiers and rewards.
    metadata:
      platform: Vertex
      protocol: a2a
    card:
      name: Loyalty Agent
      description: Manages loyalty points, tiers and rewards.
      url: ${loyaltyAgent.url}
      protocolVersion: 0.3.0
      version: 1.0.0
      capabilities:
        streaming: false
        pushNotifications: false
      defaultInputModes:
        - application/json
        - text/plain
      defaultOutputModes:
        - application/json
        - text/plain
      skills:
        - id: loyalty-balance
          name: Loyalty Balance
          description: Report points and redeem rewards.
          tags:
            - loyalty
          examples:
            - How many points do I have?
            - Redeem 500 points
