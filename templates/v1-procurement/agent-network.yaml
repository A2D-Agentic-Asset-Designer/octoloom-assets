schemaVersion: 1.0.0
label: Procurement Assistant
brokers:
  octo_p1_procurement-broker:
    card:
      protocolVersion: 0.3.0
      name: octo_p1_procurement-broker
      description: "A tool-heavy broker: two agents and five procurement tool servers turn requests into purchase orders."
      url: ${ingressgw.url}/octo_p1_procurement-broker
      version: 1.0.0
      capabilities:
        streaming: false
        pushNotifications: false
        stateTransitionHistory: false
      defaultInputModes:
        - application/json
        - text/plain
      defaultOutputModes:
        - application/json
        - text/plain
      skills:
        - id: purchase-request
          name: Purchase Request
          description: Create a purchase order from a request.
          tags:
            - procurement
          examples:
            - Order 5 monitors for cost centre CC-410
            - Is supplier SUP-88 approved?
    spec:
      llm:
        ref:
          name: octo_p1_openai
        configuration:
          model: gpt-5-mini
      instructions:
        - You turn purchase requests into compliant purchase orders.
        - Find the item in the catalog, check the cost-centre budget and look up the supplier.
        - Ask the Supplier Risk agent to assess any supplier that is not yet approved.
        - Use an existing framework contract when one exists; create the purchase order only when the budget is sufficient.
        - Ask the Sourcing agent for alternatives when an item is unavailable or over budget.
      links:
        - agent:
            ref:
              name: octo_p1_supplier-risk-agent
        - agent:
            ref:
              name: octo_p1_sourcing-agent
      tools:
        - mcp:
            ref:
              name: octo_p1_catalog-mcp
            allowed:
              - search_catalog
        - mcp:
            ref:
              name: octo_p1_budget-mcp
            allowed:
              - check_budget
        - mcp:
            ref:
              name: octo_p1_supplier-registry-mcp
            allowed:
              - get_supplier
        - mcp:
            ref:
              name: octo_p1_contracts-mcp
            allowed:
              - find_contract
        - mcp:
            ref:
              name: octo_p1_purchase-orders-mcp
            allowed:
              - create_purchase_order
      maxNumberOfLoops: 25
      maxConsecutiveErrors: 3
      taskTimeoutSecs: 90
llmProviders:
  octo_p1_openai:
    label: OpenAI
    description: OpenAI LLM provider
    metadata:
      platform: OpenAI
      models:
        - gpt-5-mini
connections:
  openai-connection:
    kind: llm
    ref:
      name: octo_p1_openai
    spec:
      url: https://api.openai.com/v1/
      configuration:
        apiKey: ${openai.apiKey}
        timeout: 600000
  catalog-mcp-connection:
    kind: mcp
    ref:
      name: octo_p1_catalog-mcp
    spec:
      url: ${catalogMcp.url}
  budget-mcp-connection:
    kind: mcp
    ref:
      name: octo_p1_budget-mcp
    spec:
      url: ${budgetMcp.url}
  supplier-registry-mcp-connection:
    kind: mcp
    ref:
      name: octo_p1_supplier-registry-mcp
    spec:
      url: ${supplierRegistryMcp.url}
  contracts-mcp-connection:
    kind: mcp
    ref:
      name: octo_p1_contracts-mcp
    spec:
      url: ${contractsMcp.url}
  purchase-orders-mcp-connection:
    kind: mcp
    ref:
      name: octo_p1_purchase-orders-mcp
    spec:
      url: ${purchaseOrdersMcp.url}
  supplier-risk-agent-connection:
    kind: agent
    ref:
      name: octo_p1_supplier-risk-agent
    spec:
      url: ${supplierRiskAgent.url}
  sourcing-agent-connection:
    kind: agent
    ref:
      name: octo_p1_sourcing-agent
    spec:
      url: ${sourcingAgent.url}
mcpServers:
  octo_p1_catalog-mcp:
    label: Catalog MCP
    description: Product catalog.
    metadata:
      transport:
        kind: streamableHttp
        path: /mcp
      tools:
        - name: search_catalog
          description: Search the catalog.
          inputSchema:
            type: object
            properties:
              query:
                type: string
                description: Item description
            required:
              - query
  octo_p1_budget-mcp:
    label: Budget MCP
    description: Cost-centre budgets.
    metadata:
      transport:
        kind: streamableHttp
        path: /mcp
      tools:
        - name: check_budget
          description: Remaining budget of a cost centre.
          inputSchema:
            type: object
            properties:
              cost_center:
                type: string
                description: Cost centre id
            required:
              - cost_center
  octo_p1_supplier-registry-mcp:
    label: Supplier Registry MCP
    description: Approved suppliers.
    metadata:
      transport:
        kind: streamableHttp
        path: /mcp
      tools:
        - name: get_supplier
          description: Get a supplier.
          inputSchema:
            type: object
            properties:
              supplier_id:
                type: string
                description: Supplier id
            required:
              - supplier_id
  octo_p1_contracts-mcp:
    label: Contracts MCP
    description: Framework contracts.
    metadata:
      transport:
        kind: streamableHttp
        path: /mcp
      tools:
        - name: find_contract
          description: Find a framework contract for a supplier.
          inputSchema:
            type: object
            properties:
              supplier_id:
                type: string
                description: Supplier id
            required:
              - supplier_id
  octo_p1_purchase-orders-mcp:
    label: Purchase Orders MCP
    description: Purchase orders.
    metadata:
      transport:
        kind: streamableHttp
        path: /mcp
      tools:
        - name: create_purchase_order
          description: Create a purchase order.
          inputSchema:
            type: object
            properties:
              sku:
                type: string
                description: Item SKU
              quantity:
                type: number
                description: Quantity
              cost_center:
                type: string
                description: Cost centre
            required:
              - sku
              - quantity
              - cost_center
agents:
  octo_p1_supplier-risk-agent:
    label: Supplier Risk Agent
    description: Assesses supplier financial, ESG and sanctions risk.
    metadata:
      platform: Databricks
      protocol: a2a
    card:
      name: Supplier Risk Agent
      description: Assesses supplier financial, ESG and sanctions risk.
      url: ${supplierRiskAgent.url}
      protocolVersion: 0.3.0
      version: 1.0.0
      capabilities:
        streaming: false
        pushNotifications: false
      defaultInputModes:
        - application/json
        - text/plain
      defaultOutputModes:
        - application/json
        - text/plain
      skills:
        - id: assess-supplier
          name: Assess Supplier
          description: Score a supplier risk.
          tags:
            - risk
          examples:
            - Assess supplier SUP-88
  octo_p1_sourcing-agent:
    label: Sourcing Agent
    description: Finds alternative items and suppliers.
    metadata:
      platform: LangChain
      protocol: a2a
    card:
      name: Sourcing Agent
      description: Finds alternative items and suppliers.
      url: ${sourcingAgent.url}
      protocolVersion: 0.3.0
      version: 1.0.0
      capabilities:
        streaming: false
        pushNotifications: false
      defaultInputModes:
        - application/json
        - text/plain
      defaultOutputModes:
        - application/json
        - text/plain
      skills:
        - id: find-alternatives
          name: Find Alternatives
          description: Suggest alternative items or suppliers.
          tags:
            - sourcing
          examples:
            - Alternatives for a 27" monitor
