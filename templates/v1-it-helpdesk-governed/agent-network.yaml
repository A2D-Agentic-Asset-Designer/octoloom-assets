schemaVersion: 1.0.0
label: IT Helpdesk (governed)
brokers:
  octo_ih1g_it-helpdesk-broker:
    card:
      protocolVersion: 0.3.0
      name: octo_ih1g_it-helpdesk-broker
      description: Triage and access agents work with ITSM, monitoring and knowledge-base tools to resolve tickets.
      url: ${ingressgw.url}/octo_ih1g_it-helpdesk-broker
      version: 1.0.0
      capabilities:
        streaming: false
        pushNotifications: false
        stateTransitionHistory: false
      defaultInputModes:
        - application/json
        - text/plain
      defaultOutputModes:
        - application/json
        - text/plain
      skills:
        - id: it-support
          name: IT Support
          description: Resolve IT problems and access requests.
          tags:
            - it
            - helpdesk
          examples:
            - VPN is not connecting since this morning
            - I need access to the finance SharePoint
            - My laptop screen flickers
    spec:
      llm:
        ref:
          name: octo_ih1g_openai
        configuration:
          model: gpt-5-mini
      instructions:
        - You are the IT helpdesk for employees.
        - Before opening an incident, check service health with get_service_health and search the knowledge base with search_articles.
        - Use the Triage agent to classify and prioritise problems, the Access Request agent for permissions and group membership, and the Device Support agent for hardware.
        - Open an incident with create_incident only when no article or known outage explains the problem.
        - Always return the incident or article id to the user.
      links:
        - agent:
            ref:
              name: octo_ih1g_triage-agent
        - agent:
            ref:
              name: octo_ih1g_access-request-agent
        - agent:
            ref:
              name: octo_ih1g_device-support-agent
      tools:
        - mcp:
            ref:
              name: octo_ih1g_itsm-mcp
            allowed:
              - create_incident
              - get_incident
        - mcp:
            ref:
              name: octo_ih1g_monitoring-mcp
            allowed:
              - get_service_health
        - mcp:
            ref:
              name: octo_ih1g_knowledge-base-mcp
            allowed:
              - search_articles
      maxNumberOfLoops: 25
      maxConsecutiveErrors: 3
      taskTimeoutSecs: 90
      policies:
        - ref:
            name: rate-limiting
            namespace: 68ef9520-24e9-4cf2-b2f5-620025690913
          configuration:
            rateLimits:
              - maximumRequests: 60
                timePeriodInMilliseconds: 60000
            exposeHeaders: true
llmProviders:
  octo_ih1g_openai:
    label: OpenAI
    description: OpenAI LLM provider
    metadata:
      platform: OpenAI
      models:
        - gpt-5-mini
connections:
  openai-connection:
    kind: llm
    ref:
      name: octo_ih1g_openai
    spec:
      url: https://api.openai.com/v1/
      configuration:
        apiKey: ${openai.apiKey}
        timeout: 600000
  itsm-mcp-connection:
    kind: mcp
    ref:
      name: octo_ih1g_itsm-mcp
    spec:
      url: ${itsmMcp.url}
      policies:
        - ref:
            name: mcp-pii-detector
            namespace: 68ef9520-24e9-4cf2-b2f5-620025690913
          configuration:
            entities:
              - Email
              - US SSN
              - Credit Card
              - Phone Number
            action: Log and mask
  monitoring-mcp-connection:
    kind: mcp
    ref:
      name: octo_ih1g_monitoring-mcp
    spec:
      url: ${monitoringMcp.url}
      policies:
        - ref:
            name: mcp-schema-validation
            namespace: 68ef9520-24e9-4cf2-b2f5-620025690913
          configuration:
            validateToolSchema: true
        - ref:
            name: header-injection
            namespace: 68ef9520-24e9-4cf2-b2f5-620025690913
          configuration:
            inboundHeaders:
              - key: x-octoloom-source
                value: it-helpdesk-governed-v1
  knowledge-base-mcp-connection:
    kind: mcp
    ref:
      name: octo_ih1g_knowledge-base-mcp
    spec:
      url: ${knowledgeBaseMcp.url}
      policies:
        - ref:
            name: mcp-pii-detector
            namespace: 68ef9520-24e9-4cf2-b2f5-620025690913
          configuration:
            entities:
              - Email
              - US SSN
              - Credit Card
              - Phone Number
            action: Log and mask
  triage-agent-connection:
    kind: agent
    ref:
      name: octo_ih1g_triage-agent
    spec:
      url: ${triageAgent.url}
      policies:
        - ref:
            name: a-two-a-pii-detector
            namespace: 68ef9520-24e9-4cf2-b2f5-620025690913
          configuration:
            entities:
              - Email
              - US SSN
              - Credit Card
            action: Log
  access-request-agent-connection:
    kind: agent
    ref:
      name: octo_ih1g_access-request-agent
    spec:
      url: ${accessRequestAgent.url}
      policies:
        - ref:
            name: header-injection
            namespace: 68ef9520-24e9-4cf2-b2f5-620025690913
          configuration:
            inboundHeaders:
              - key: x-correlation-source
                value: octo_ih1g_it-helpdesk-broker
        - ref:
            name: a-two-a-prompt-decorator
            namespace: 68ef9520-24e9-4cf2-b2f5-620025690913
          configuration:
            textDecorators:
              - text: "#['Answer concisely and never include personal data.']"
  device-support-agent-connection:
    kind: agent
    ref:
      name: octo_ih1g_device-support-agent
    spec:
      url: ${deviceSupportAgent.url}
      policies:
        - ref:
            name: a-two-a-pii-detector
            namespace: 68ef9520-24e9-4cf2-b2f5-620025690913
          configuration:
            entities:
              - Email
              - US SSN
              - Credit Card
            action: Log
mcpServers:
  octo_ih1g_itsm-mcp:
    label: ITSM MCP
    description: Incident management.
    metadata:
      transport:
        kind: streamableHttp
        path: /mcp
      tools:
        - name: create_incident
          description: Open an incident.
          inputSchema:
            type: object
            properties:
              summary:
                type: string
                description: Problem summary
              priority:
                type: string
                description: P1-P4
            required:
              - summary
        - name: get_incident
          description: Get the status of an incident.
          inputSchema:
            type: object
            properties:
              incident_id:
                type: string
                description: Incident id
            required:
              - incident_id
  octo_ih1g_monitoring-mcp:
    label: Monitoring MCP
    description: Service health and known outages.
    metadata:
      transport:
        kind: streamableHttp
        path: /mcp
      tools:
        - name: get_service_health
          description: Health of a service (vpn, email, erp, wifi).
          inputSchema:
            type: object
            properties:
              service:
                type: string
                description: Service name
            required:
              - service
  octo_ih1g_knowledge-base-mcp:
    label: Knowledge Base MCP
    description: IT knowledge articles.
    metadata:
      transport:
        kind: streamableHttp
        path: /mcp
      tools:
        - name: search_articles
          description: Search knowledge articles.
          inputSchema:
            type: object
            properties:
              query:
                type: string
                description: Search text
            required:
              - query
agents:
  octo_ih1g_triage-agent:
    label: IT Triage Agent
    description: Classifies IT problems, sets priority and proposes first steps.
    metadata:
      platform: OpenAI
      protocol: a2a
    card:
      name: IT Triage Agent
      description: Classifies IT problems, sets priority and proposes first steps.
      url: ${triageAgent.url}
      protocolVersion: 0.3.0
      version: 1.0.0
      capabilities:
        streaming: false
        pushNotifications: false
      defaultInputModes:
        - application/json
        - text/plain
      defaultOutputModes:
        - application/json
        - text/plain
      skills:
        - id: triage-ticket
          name: Triage Ticket
          description: Classify an IT problem and set its priority.
          tags:
            - triage
          examples:
            - VPN is not connecting
  octo_ih1g_access-request-agent:
    label: Access Request Agent
    description: Grants and revokes application access and group membership with approvals.
    metadata:
      platform: ServiceNow
      protocol: a2a
    card:
      name: Access Request Agent
      description: Grants and revokes application access and group membership with approvals.
      url: ${accessRequestAgent.url}
      protocolVersion: 0.3.0
      version: 1.0.0
      capabilities:
        streaming: false
        pushNotifications: false
      defaultInputModes:
        - application/json
        - text/plain
      defaultOutputModes:
        - application/json
        - text/plain
      skills:
        - id: request-access
          name: Request Access
          description: Request access to an application or group.
          tags:
            - access
            - iam
          examples:
            - I need access to the finance SharePoint
  octo_ih1g_device-support-agent:
    label: Device Support Agent
    description: Diagnoses laptops and peripherals and arranges repairs or swaps.
    metadata:
      platform: MuleSoft
      protocol: a2a
    card:
      name: Device Support Agent
      description: Diagnoses laptops and peripherals and arranges repairs or swaps.
      url: ${deviceSupportAgent.url}
      protocolVersion: 0.3.0
      version: 1.0.0
      capabilities:
        streaming: false
        pushNotifications: false
      defaultInputModes:
        - application/json
        - text/plain
      defaultOutputModes:
        - application/json
        - text/plain
      skills:
        - id: device-repair
          name: Device Repair
          description: Diagnose a device and arrange a repair or swap.
          tags:
            - hardware
          examples:
            - My laptop screen flickers
