# Publishes the Octoloom documentation site (octoloom#301) to GitHub Pages.
# docs/ and mkdocs.yml are generated by docs-src/build_docs.py from the Octoloom repo (which is private),
# so this workflow only builds and deploys what is committed here.
name: docs
on:
  push:
    branches: [main]
    paths: [docs/**, docs-src/**, mkdocs.yml, .github/workflows/docs.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "mkdocs==1.6.1" "mkdocs-material==9.*"
      - run: mkdocs build --strict -d site
        env:
          NO_MKDOCS_2_WARNING: '1'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
